<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><title>Weetje klein hormoon</title>
<style>
:root{--bg:#0B0B0D;--gold:#C9A227;--text:#B7B1A3;--light:#F5F2EA;--surface:#141417;--border:#3A3A42}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;background:var(--bg)}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--text);position:relative;overflow:hidden}
.tag{position:absolute;top:150px;left:90px;font-size:34px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:600}
.pct{position:absolute;top:210px;left:80px;right:80px;font-size:640px;line-height:1;color:var(--gold);font-weight:800;letter-spacing:-.05em}
h1{position:absolute;top:840px;left:90px;right:90px;font-size:158px;line-height:1;color:var(--light);font-weight:800;letter-spacing:-.04em;white-space:nowrap}
.lead{position:absolute;top:1030px;left:90px;right:90px;font-size:88px;line-height:1.1;color:var(--light);font-weight:600}
.lead span{color:var(--gold)}
.chain{position:absolute;top:1300px;left:90px;right:90px;display:flex;justify-content:space-between}
.aa{width:92px;height:92px;border-radius:50%;border:4px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:700;color:var(--gold)}
.big{position:absolute;top:1450px;left:90px;right:90px;background:var(--surface);border:2px solid var(--border);border-radius:8px;padding:36px 48px;font-size:44px;line-height:1.3}
.big b{color:var(--light)}
.src{position:absolute;left:90px;right:90px;top:1670px;font-size:28px;line-height:1.4}
.foot{position:absolute;left:90px;right:90px;bottom:90px;display:flex;align-items:center;gap:20px;font-size:34px}
.logo{width:64px;height:64px;border-radius:8px;background:var(--gold);color:var(--bg);font-weight:800;font-size:40px;display:flex;align-items:center;justify-content:center}
.foot .url{margin-left:auto;color:var(--gold)}
</style></head><body>
<div class="tag">Weetje · Bibliotheek</div>
<div class="pct">9</div>
<h1>aminozuren</h1>
<div class="lead"><span>Dit hormoon</span> past in 9 letters.</div>
<div class="chain"><div class="aa">C</div><div class="aa">Y</div><div class="aa">I</div><div class="aa">Q</div><div class="aa">N</div><div class="aa">C</div><div class="aa">P</div><div class="aa">L</div><div class="aa">G</div></div>
<div class="big"><b>Oxytocine</b>: elke letter is één aminozuur.</div>
<div class="src">Bron: overzichtsartikel, Int J Mol Sci 2023 · PubMed 36768879<br>Uitsluitend voor onderzoek.</div>
<div class="foot"><div class="logo">P</div>PeptideMan<span class="url">peptideman.nl</span></div>
</body></html>
