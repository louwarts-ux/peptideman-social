<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><title>Mythe vs Feit peptide eiwit</title>
<style>
:root{--bg:#0B0B0D;--gold:#C9A227;--text:#B7B1A3;--light:#F5F2EA;--surface:#141417;--border:#3A3A42}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1000px;height:1500px;background:var(--bg)}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--text);position:relative;overflow:hidden}
.tag{position:absolute;top:96px;left:80px;font-size:22px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:600}
h1{position:absolute;top:150px;left:80px;right:80px;font-size:104px;line-height:1.02;color:var(--light);font-weight:800;letter-spacing:-.03em}
h1 span{color:var(--gold)}
.row{position:absolute;left:80px;right:80px;display:flex;flex-direction:column;gap:22px}
.r1{top:520px}
.r2{top:800px}
.lab{font-size:22px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:600}
.chain{display:flex;align-items:center;height:80px}
.aa{flex:0 0 auto;width:54px;height:54px;border-radius:50%;border:3px solid var(--gold);margin-right:-3px;background:var(--bg)}
.aa.f{background:var(--gold)}
.cap{font-size:34px;line-height:1.2;color:var(--light);font-weight:700}
.cap small{display:block;margin-top:6px;font-size:26px;font-weight:400;color:var(--text)}
.chain.long{height:auto;flex-wrap:wrap;row-gap:10px}
.chain.long .aa{width:44px;height:44px;margin-right:-3px}
.big{position:absolute;top:1090px;left:80px;right:80px;background:var(--surface);border:2px solid var(--border);border-radius:8px;padding:30px 36px;font-size:32px;line-height:1.35}
.big b{color:var(--light)}
.src{position:absolute;left:80px;right:80px;top:1255px;font-size:22px;line-height:1.4}
.foot{position:absolute;left:80px;right:80px;bottom:64px;display:flex;align-items:center;gap:16px;font-size:24px}
.logo{width:44px;height:44px;border-radius:8px;background:var(--gold);color:var(--bg);font-weight:800;font-size:28px;display:flex;align-items:center;justify-content:center}
.foot .url{margin-left:auto;color:var(--gold)}
</style></head><body>
<div class="tag">Mythe vs Feit · Bibliotheek</div>
<h1>Peptide = eiwit? <span>Nee.</span></h1>
<div class="row r1">
<div class="lab">Peptide</div>
<div class="chain"><div class="aa f"></div><div class="aa f"></div><div class="aa f"></div><div class="aa f"></div><div class="aa f"></div><div class="aa f"></div><div class="aa f"></div><div class="aa f"></div><div class="aa f"></div><div class="aa f"></div></div>

</div>
<div class="row r2">
<div class="lab">Eiwit</div>
<div class="chain long"><div class="aa"></div><div class="aa"></div><div class="aa"></div><div class="aa"></div><div class="aa"></div><div class="aa"></div><div class="aa"></div><div class="aa"></div><div class="aa"></div><div class="aa"></div><div class="aa"></div><div class="aa"></div><div class="aa"></div><div class="aa"></div><div class="aa"></div><div class="aa"></div><div class="aa"></div><div class="aa"></div><div class="aa"></div><div class="aa"></div><div class="aa"></div><div class="aa"></div><div class="aa"></div><div class="aa"></div></div>
<div class="cap">Lange keten<small>meer dan 50 aminozuren</small></div>
</div>
<div class="big">Het verschil zit in de <b>lengte</b> van de aminozuurketen.</div>
<div class="src">Bron: PubMed 32965931 · indeling volgens IUPAC<br>Uitsluitend voor onderzoek.</div>
<div class="foot"><div class="logo">P</div>PeptideMan<span class="url">peptideman.nl</span></div>
</body></html>
