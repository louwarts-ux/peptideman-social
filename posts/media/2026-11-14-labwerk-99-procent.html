<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><title>Labwerk 99 procent</title>
<style>
:root{--bg:#0B0B0D;--gold:#C9A227;--text:#B7B1A3;--light:#F5F2EA;--surface:#141417;--border:#3A3A42}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;background:var(--bg)}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--text);position:relative;overflow:hidden}
.tag{position:absolute;top:150px;left:90px;font-size:34px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:600}
.pct{position:absolute;top:230px;left:80px;right:80px;font-size:440px;line-height:1;color:var(--gold);font-weight:800;letter-spacing:-.05em}
h1{position:absolute;top:670px;left:90px;right:90px;font-size:230px;line-height:1;color:var(--light);font-weight:800;letter-spacing:-.04em}
.lead{position:absolute;top:960px;left:90px;right:90px;font-size:88px;line-height:1.1;color:var(--light);font-weight:600}
.lead span{color:var(--gold)}
.big{position:absolute;top:1230px;left:90px;right:90px;background:var(--surface);border:2px solid var(--border);border-radius:8px;padding:48px 52px;font-size:48px;line-height:1.35}
.big b{color:var(--light)}
.src{position:absolute;left:90px;right:90px;top:1625px;font-size:28px;line-height:1.4}
.foot{position:absolute;left:90px;right:90px;bottom:110px;display:flex;align-items:center;gap:20px;font-size:34px}
.logo{width:64px;height:64px;border-radius:8px;background:var(--gold);color:var(--bg);font-weight:800;font-size:40px;display:flex;align-items:center;justify-content:center}
.foot .url{margin-left:auto;color:var(--gold)}
</style></head><body>
<div class="tag">Labwerk · Bibliotheek</div>
<div class="pct">99%</div>
<h1>zuiver?</h1>
<div class="lead"><span>Zo lees je</span> het rapport.</div>
<div class="big">99% betekent: 99% van het gemeten signaal hoort bij de <b>hoofdstof</b>. Het zegt niet hoeveel er in het potje zit.</div>
<div class="src">Bron: Preston &amp; Phillips, Anal Bioanal Chem 2016 · PubMed 26879647<br>Uitsluitend voor onderzoek.</div>
<div class="foot"><div class="logo">P</div>PeptideMan<span class="url">peptideman.nl</span></div>
</body></html>
